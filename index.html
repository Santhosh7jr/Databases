<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple, focused to-do list." />
    <title>Daymark — To-do list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Your daily focus</p>
          <h1>Make room for<br /><em>what matters.</em></h1>
        </div>
        <div class="date-card" aria-label="Today's date">
          <span id="day-name"></span>
          <strong id="date-number"></strong>
          <span id="month-name"></span>
        </div>
      </header>

      <section class="todo-card" aria-labelledby="list-heading">
        <div class="list-heading">
          <div>
            <p class="section-label">Your list</p>
            <h2 id="list-heading"><span id="task-count">0</span> tasks left</h2>
          </div>
          <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
        </div>

        <form class="add-form" id="add-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <input id="task-input" name="task" type="text" maxlength="120" placeholder="What needs doing?" autocomplete="off" />
          <button type="submit" aria-label="Add task">+</button>
        </form>

        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter is-active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="active">To do</button>
          <button class="filter" type="button" data-filter="completed">Completed</button>
        </div>

        <ul class="task-list" id="task-list" aria-live="polite"></ul>
        <div class="empty-state" id="empty-state" hidden>
          <span class="empty-icon">✦</span>
          <p id="empty-title">Nothing here yet.</p>
          <span id="empty-hint">Add a task above to get started.</span>
        </div>
      </section>

      <footer>
        <span class="footer-dot"></span>
        <span id="progress-message">A little progress every day.</span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
